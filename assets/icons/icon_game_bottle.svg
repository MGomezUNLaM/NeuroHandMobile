<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bottleGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="bShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#064E3B" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Bottle Shape rotated diagonally -->
  <g transform="rotate(-30 32 32)" filter="url(#bShadow)">
    <!-- Cork / Cap -->
    <rect x="29" y="8" width="6" height="5" rx="1.5" fill="#D97706"/>
    <!-- Bottle Neck -->
    <rect x="28" y="13" width="8" height="10" rx="1" fill="url(#bottleGlass)"/>
    <!-- Bottle Body -->
    <path d="M 28 23 C 24 25, 22 28, 22 34 L 22 50 C 22 53, 25 55, 28 55 L 36 55 C 39 55, 42 53, 42 50 L 42 34 C 42 28, 40 25, 36 23 Z" fill="url(#bottleGlass)"/>
    <!-- Label -->
    <rect x="23" y="34" width="18" height="12" rx="2" fill="#FEF08A"/>
    <!-- Glass Highlight -->
    <path d="M 24 30 L 24 49" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- Sparkles around bottle -->
  <circle cx="16" cy="22" r="2" fill="#FDE047"/>
  <circle cx="48" cy="18" r="2.5" fill="#FDE047"/>
  <circle cx="50" cy="42" r="1.8" fill="#FDE047"/>
</svg>
