<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <filter id="timerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Top Buttons -->
  <rect x="29" y="6" width="6" height="6" rx="1.5" fill="#475569"/>
  <rect x="27" y="3" width="10" height="4" rx="2" fill="#64748B"/>
  <rect x="42" y="10" width="5" height="5" rx="1" transform="rotate(30 44 12)" fill="#64748B"/>
  <!-- Outer Case -->
  <circle cx="32" cy="36" r="22" fill="#334155" filter="url(#timerShadow)"/>
  <circle cx="32" cy="36" r="19" fill="#0EA5E9"/>
  <!-- White Dial Face -->
  <circle cx="32" cy="36" r="16.5" fill="#FFFFFF"/>
  <!-- Ticks -->
  <circle cx="32" cy="22" r="1.3" fill="#64748B"/>
  <circle cx="46" cy="36" r="1.3" fill="#64748B"/>
  <circle cx="32" cy="50" r="1.3" fill="#64748B"/>
  <circle cx="18" cy="36" r="1.3" fill="#64748B"/>
  <!-- Red Pointer Hand -->
  <line x1="32" y1="36" x2="40" y2="28" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="36" r="2.5" fill="#E11D48"/>
</svg>
