<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fireOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="60%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="fireMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="fireCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#EA580C" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Outer Flame -->
  <path d="M 32 6 C 36 16, 46 22, 48 32 C 50 43, 44 54, 32 58 C 20 54, 14 43, 16 32 C 18 20, 27 15, 27 8 C 27 6, 29 12, 32 6 Z" fill="url(#fireOuter)" filter="url(#fireGlow)"/>
  <!-- Secondary Flame Tongue -->
  <path d="M 33 22 C 38 27, 43 32, 42 39 C 41 47, 36 53, 31 55 C 24 53, 21 46, 23 39 C 25 31, 31 29, 33 22 Z" fill="url(#fireMid)"/>
  <!-- Glowing Core -->
  <path d="M 32 35 C 36 38, 37 42, 36 47 C 35 51, 33 53, 31 53 C 28 53, 26 50, 27 46 C 28 41, 30 39, 32 35 Z" fill="url(#fireCore)"/>
  <!-- Tiny Sparkle -->
  <circle cx="39" cy="18" r="1.8" fill="#FBBF24" opacity="0.8"/>
  <circle cx="23" cy="24" r="1.3" fill="#FBBF24" opacity="0.7"/>
</svg>
