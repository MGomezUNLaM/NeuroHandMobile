<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="padBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="40%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="dpadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <filter id="padShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#312E81" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Main Controller Body -->
  <path d="M 18 18 C 11 18, 6 27, 7 38 C 8 47, 13 54, 20 52 C 26 50, 28 41, 32 41 C 36 41, 38 50, 44 52 C 51 54, 56 47, 57 38 C 58 27, 53 18, 46 18 C 40 18, 36 21, 32 21 C 28 21, 24 18, 18 18 Z" fill="url(#padBody)" filter="url(#padShadow)"/>
  <!-- Top Trigger Accents -->
  <path d="M 16 18 C 16 15, 23 15, 23 18 Z" fill="#4338CA"/>
  <path d="M 41 18 C 41 15, 48 15, 48 18 Z" fill="#4338CA"/>
  <!-- Center Plate / Touchpad -->
  <rect x="27" y="24" width="10" height="7" rx="3.5" fill="#4338CA" opacity="0.6"/>
  <!-- D-Pad (Left) -->
  <rect x="19" y="26" width="6" height="18" rx="2" fill="url(#dpadGrad)"/>
  <rect x="13" y="32" width="18" height="6" rx="2" fill="url(#dpadGrad)"/>
  <circle cx="22" cy="35" r="2" fill="#4338CA"/>
  <!-- Action Buttons (Right) -->
  <circle cx="43" cy="27" r="3" fill="#F43F5E"/> <!-- Y - Red -->
  <circle cx="49" cy="33" r="3" fill="#10B981"/> <!-- B - Green -->
  <circle cx="37" cy="33" r="3" fill="#0EA5E9"/> <!-- X - Blue -->
  <circle cx="43" cy="39" r="3" fill="#FBBF24"/> <!-- A - Yellow -->
  <!-- Thumbstick nubs -->
  <circle cx="27" cy="42" r="3.5" fill="#312E81"/>
  <circle cx="27" cy="42" r="2" fill="#6366F1"/>
  <circle cx="37" cy="42" r="3.5" fill="#312E81"/>
  <circle cx="37" cy="42" r="2" fill="#6366F1"/>
</svg>
