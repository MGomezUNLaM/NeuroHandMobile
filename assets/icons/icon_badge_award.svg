<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="rosetteEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="rosetteGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="rosetteShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#064E3B" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Ribbon Tails -->
  <path d="M 23 34 L 17 56 L 25 50 L 33 56 L 29 34 Z" fill="#047857"/>
  <path d="M 41 34 L 35 56 L 43 50 L 51 56 L 45 34 Z" fill="#059669"/>
  <!-- Rosette Scallop Background -->
