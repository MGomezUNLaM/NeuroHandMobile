  <!-- Gold Inner Ring -->
  <circle cx="32" cy="27" r="14" fill="url(#rosetteGold)"/>
  <circle cx="32" cy="27" r="12" fill="#047857"/>
  <!-- Checkmark or Star in Center -->
  <path d="M 26 27 L 30 31 L 39 21" fill="none" stroke="#FEF08A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
